services:
  gateway:
    environment:
      GEMINI_GATEWAY_MAX_ROUTE_ATTEMPTS: ${GEMINI_GATEWAY_MAX_ROUTE_ATTEMPTS:-5}
      GEMINI_GATEWAY_OPENROUTER_API_KEY: ${GEMINI_GATEWAY_OPENROUTER_API_KEY:-}
      GEMINI_GATEWAY_OPENROUTER_EMBEDDINGS_FALLBACK_ENABLED: ${GEMINI_GATEWAY_OPENROUTER_EMBEDDINGS_FALLBACK_ENABLED:-false}
      GEMINI_GATEWAY_OPENROUTER_EMBEDDINGS_DIRECT_ONLY_ENABLED: ${GEMINI_GATEWAY_OPENROUTER_EMBEDDINGS_DIRECT_ONLY_ENABLED:-false}
      GEMINI_GATEWAY_OPENROUTER_BASE_URL: ${GEMINI_GATEWAY_OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      GEMINI_GATEWAY_OPENLUX_API_KEY: ${GEMINI_GATEWAY_OPENLUX_API_KEY:-}
      GEMINI_GATEWAY_OPENLUX_BASE_URL: ${GEMINI_GATEWAY_OPENLUX_BASE_URL:-https://api.openlux.ai/v1}
      GEMINI_GATEWAY_OPENLUX_CHAT_MODE: ${GEMINI_GATEWAY_OPENLUX_CHAT_MODE:-off}
      GEMINI_GATEWAY_OPENLUX_CHAT_MODEL: ${GEMINI_GATEWAY_OPENLUX_CHAT_MODEL:-gemini-3.7-flash}
      GEMINI_GATEWAY_OPENLUX_EMBEDDINGS_DIRECT_ONLY_ENABLED: ${GEMINI_GATEWAY_OPENLUX_EMBEDDINGS_DIRECT_ONLY_ENABLED:-false}
      GEMINI_GATEWAY_OPENLUX_EMBEDDINGS_MODEL: ${GEMINI_GATEWAY_OPENLUX_EMBEDDINGS_MODEL:-gemini-embedding-2-preview}
      GEMINI_GATEWAY_OPENLUX_PRICING_GROUP: ${GEMINI_GATEWAY_OPENLUX_PRICING_GROUP:-Anti-Gemini-1}
      GEMINI_GATEWAY_OPENLUX_MAX_STREAM_BYTES: ${GEMINI_GATEWAY_OPENLUX_MAX_STREAM_BYTES:-262144}
      GEMINI_GATEWAY_OPENLUX_PRICING_TIMEOUT_SECONDS: ${GEMINI_GATEWAY_OPENLUX_PRICING_TIMEOUT_SECONDS:-5}
      GEMINI_GATEWAY_OPENLUX_PRICING_CACHE_SECONDS: ${GEMINI_GATEWAY_OPENLUX_PRICING_CACHE_SECONDS:-300}
      GEMINI_GATEWAY_OPENLUX_COOLDOWN_SECONDS: ${GEMINI_GATEWAY_OPENLUX_COOLDOWN_SECONDS:-30}
